  .sync-btn{

    background:var(--bg-raised); border:1px solid var(--hairline); color:var(--ink);
    font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin-top:2px;
  }
  .sync-btn:active{ background:var(--slate); color:var(--bg); transform:rotate(45deg); }
  @keyframes spin-sync{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .sync-btn.spinning{ animation: spin-sync 0.6s linear infinite; }

  .clock-panel{
    background:var(--bg-raised); border:1px solid var(--hairline); border-radius:12px;
    padding:16px; text-align:center; margin-bottom:18px;
  }
  .clock-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px; }
  .clock-display{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:44px; letter-spacing:0.03em; color:var(--ink); }
  .clock-ampm{ font-size:18px; font-weight:600; color:var(--ink-dim); letter-spacing:0.05em; }
  .clock-date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); margin-top:4px; }

  .week-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:14px;
  }
  .week-nav button{
    background:var(--bg-raised); border:1px solid var(--hairline); color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace; font-size:13px; padding:8px 14px; border-radius:8px; cursor:pointer;
  }
  .week-nav .week-range{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); text-align:center; flex:1;
  }

  .tabs{ display:flex; gap:5px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{
    flex:1; min-width:12%; text-align:center; padding:8px 3px; border-radius:8px;
    font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px;
    letter-spacing:0.02em; text-transform:uppercase; cursor:pointer;
    background:var(--bg-raised); color:var(--ink-dim); border:1px solid var(--hairline);
    display:flex; flex-direction:column; align-items:center; line-height:1.15;
  }
  .tab .tab-date{ font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:400; text-transform:none; margin-top:1px; opacity:0.75; }
  .tab.active{ background:var(--amber); color:#fff; border-color:var(--amber); }

  .day-note{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:12px; }

  .auto-toggle{
    background:var(--bg-raised); border:1px solid var(--hairline); border-radius:9px;
    padding:11px 13px; margin-bottom:16px;
  }
  .auto-label{
    display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink);
    cursor:pointer; user-select:none;
  }
  .auto-label input{ width:17px; height:17px; accent-color:var(--amber); }
  .auto-status{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--slate); margin-top:5px; padding-left:26px; }

  .block-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .block-item{
    position:relative; overflow:hidden;

    border-right:1px solid var(--hairline); border-bottom:1px solid var(--hairline);
  }
  .block-item.selected{ outline:2px solid var(--ink-dim); }
  .bi-fill{
    position:absolute; top:0; left:0; bottom:0; width:0%;
    background:var(--catcolor, var(--amber)); opacity:0.9; z-index:0;
    transition: width 0.9s linear;
  }
  .bi-fill.done{ background:var(--green); }
  .block-item .bi-content{ position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; width:100%; }
  .block-item .bi-title{ font-size:14.5px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.35); display:flex; align-items:center; gap:6px; }
  .bi-central-badge{

  .block-item .bi-time{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(255,255,255,0.75); margin-top:2px; }
  .block-item .bi-dur{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(255,255,255,0.85); white-space:nowrap; padding-left:10px; }

  .timer-panel{
    background:var(--bg-raised); border:1px solid var(--hairline); border-radius:14px;

  .timer-panel.orange{ background:#3A2416; border-color:var(--coral); }
  .timer-panel.critical{ background:#3A1D1D; border-color:var(--danger); }
  .timer-panel.overtime{ background:#3A1D1D; border-color:var(--danger); }

  .timer-label{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .timer-display{

  .timer-display.overtime{ color:var(--danger); }

  .up-next{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); margin-top:10px; padding-top:10px; border-top:1px dashed var(--hairline); }

  }

    position:absolute; top:0; left:0; bottom:0; width:0%;

    transition: width 0.9s linear;
  }
  .qt-fill.warning{ background:var(--slate); }
  .qt-fill.orange{ background:var(--coral); }
  .qt-fill.critical, .qt-fill.overtime{ background:var(--danger); }
  .qt-btn-label{ position:relative; z-index:1; }
  .qt-btn:active{ background:var(--slate); color:var(--bg); }

    <div class="timer-sub" id="timerSub"></div>
    <div class="up-next" id="upNext"></div>
    <div class="controls">
      <button class="btn btn-start" id="btnStart" disabled>Start</button>
      <button class="btn btn-pause" id="btnPause" disabled>Pause</button>
      <button class="btn btn-reset" id="btnReset" disabled>Reset</button>
    </div>
    <div class="next-prompt" id="nextPrompt" style="display:none;"></div>
  </div>

  <div class="quick-timer-section">
    <div class="quick-timer-label">Quick Timer</div>
    <div class="quick-timer-grid" id="quickTimerGrid"></div>

</div>

function dateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

const WEEK_A_ANCHOR = new Date(2026, 6, 27); // Jul 27, 2026 = a Week A Monday
const SWITCH_RESTART = new Date(2026, 7, 5); // Aug 5, 2026

function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function computeWeekLetter(date){
  const d0 = stripTime(date);
  const a0 = stripTime(WEEK_A_ANCHOR);
  const diffDays = Math.round((d0 - a0) / 86400000);
  const diffWeeks = Math.floor(diffDays / 7);
  return (((diffWeeks % 2) + 2) % 2 === 0) ? 'A' : 'B';
}

// Base Monday = the Monday of the calendar week containing "today", for ALL weekdays (Mon-Sun alike).
function getBaseMonday(){
  const now = stripTime(new Date());
  const dow = now.getDay(); // 0=Sun..6=Sat
  const daysSinceMonday = (dow + 6) % 7; // Mon=0,Tue=1,...Sun=6
  const monday = new Date(now); monday.setDate(now.getDate() - daysSinceMonday);
  return monday;
}

function getWeekMonday(offset){
  const base = getBaseMonday();
  const m = new Date(base); m.setDate(base.getDate() + offset*7);
  return m;
}

// dayIdx -> {label, offsetFromMonday}
const DAY_CONFIG = [
  {label:'Mon', offset:0},
  {label:'Tue', offset:1},
  {label:'Wed', offset:2},
  {label:'Thu', offset:3},
  {label:'Fri', offset:4},
  {label:'Sat', offset:5},
  {label:'Sun', offset:6},
];
const DAY_LABELS = DAY_CONFIG.map(d=>d.label);

function getDateForDay(weekOffset, dayIdx){
  const monday = getWeekMonday(weekOffset);
  const d = new Date(monday); d.setDate(monday.getDate() + DAY_CONFIG[dayIdx].offset);
  return d;
}

function mergeOneOffs(templateBlocks, date){
  const oneOffs = ONEOFF_BLOCKS[dateKey(date)] || [];
  if(oneOffs.length === 0) return templateBlocks;
  const combined = [...templateBlocks, ...oneOffs];
  combined.sort((a,b) => a.s.localeCompare(b.s));
  return combined;
}

function getBlocksAndNote(dayIdx, date){
  const override = DAY_OVERRIDES[dateKey(date)];
  if(override){
    return { blocks: mergeOneOffs(override, date), note: 'one-time schedule for today' };
  }
  if(dayIdx === 0){
    const w = computeWeekLetter(date);
    return { blocks: mergeOneOffs(w==='A' ? MONDAY_A : MONDAY_B, date), note: `Week ${w}` };
  }
  if(dayIdx === 1){ return { blocks: mergeOneOffs(TUESDAY_BLOCKS, date), note: '' }; }
  if(dayIdx === 2){
    const isNew = stripTime(date) >= stripTime(SWITCH_RESTART);
    return { blocks: mergeOneOffs(isNew ? WED_NEW : WED_OLD, date), note: isNew ? 'Switch is back \u2014 noon start' : 'pre-Switch schedule' };
  }
  if(dayIdx === 3){ return { blocks: mergeOneOffs(THURSDAY_BLOCKS, date), note: '' }; }
  if(dayIdx === 4){ return { blocks: mergeOneOffs([], date), note: '' }; } // Fri: protected day off by default
  if(dayIdx === 5){ return { blocks: mergeOneOffs(SATURDAY_BLOCKS, date), note: '' }; }
  return { blocks: mergeOneOffs(SUNDAY_BLOCKS, date), note: '' };
}

function fmtDate(date){
  return date.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

function dayNameFromDate(date){
  const map = {1:'Mon', 2:'Tue', 3:'Wed', 4:'Thu', 5:'Fri', 6:'Sat', 0:'Sun'};
  return map[date.getDay()] !== undefined ? map[date.getDay()] : null;
}

function nowHHMM(date){
  return String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
}

function to12Hour(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const disp = h%12===0 ? 12 : h%12;
  const ampm = h>=12 ? 'pm' : 'am';
  return `${disp}:${String(m).padStart(2,'0')}${ampm}`;
}

function beep(freq=880, dur=180, vol=0.3){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.value = vol;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur/1000);
  }catch(e){}
}

function primeAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
document.addEventListener('touchstart', primeAudio, {once:true});
document.addEventListener('click', primeAudio, {once:true});
function tripleBeep(){ beep(880,150); setTimeout(()=>beep(880,150),250); setTimeout(()=>beep(880,150),500); }
function quadBeep(){ beep(950,120); setTimeout(()=>beep(950,120),180); setTimeout(()=>beep(950,120),360); setTimeout(()=>beep(950,120),540); }
function overtimeBeep(){ beep(660,300,0.35); }
function startChime(){
  beep(600,110,0.3);
  setTimeout(()=>beep(760,110,0.3),130);
  setTimeout(()=>beep(920,130,0.3),260);
}

function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

async function requestWakeLock(){
  try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
}

function blockSignature(b){
  return b ? (b.t + '@' + b.s) : null;
}

function saveState(){
  try{
    const blocks = getCurrentBlocks();
    const sig = selectedIdx !== null ? blockSignature(blocks[selectedIdx]) : null;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      weekOffset, currentDayIdx, selectedIdx, blockSig: sig, quickTimerMinutes, remainingSec, totalSec,
      running, blockEndEpoch, warned5, warned150, warned15, endPrompted, autoStartEnabled, lastAutoKey, savedAt: Date.now()
    }));
  }catch(e){}
}
function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearState(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

function ensureCompletedForToday(){
  const todayKey = dateKey(new Date());
  if(completedDate === todayKey) return;
  completedDate = todayKey;
  try{
    const raw = localStorage.getItem(COMPLETED_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if(parsed && parsed.date === todayKey){
      completedSigs = new Set(parsed.sigs || []);
    } else {
      completedSigs = new Set();
    }
  }catch(e){ completedSigs = new Set(); }
}

function saveCompleted(){
  try{
    localStorage.setItem(COMPLETED_KEY, JSON.stringify({ date: completedDate, sigs: [...completedSigs] }));
  }catch(e){}
}

function markCompleted(sig){
  if(!sig) return;
  ensureCompletedForToday();
  completedSigs.add(sig);
  saveCompleted();
}

function getCurrentBlocks(){
  const date = getDateForDay(weekOffset, currentDayIdx);
  return getBlocksAndNote(currentDayIdx, date).blocks;
}

function getNextBlock(){
  if(selectedIdx===null) return null;
  const blocks = getCurrentBlocks();
  if(selectedIdx+1 < blocks.length) return { block: blocks[selectedIdx+1], idx: selectedIdx+1 };
  return null;
}

function updateNextUp(){
  const el = document.getElementById('upNext');
  const next = getNextBlock();
  if(!next){ el.textContent = 'Last block for this day.'; return; }
  el.textContent = `Up next: ${next.block.t} at ${to12Hour(next.block.s)}`;
}

function showNextPrompt(){
  const el = document.getElementById('nextPrompt');
  const next = getNextBlock();
  if(!next){
    el.style.display = 'block';
    el.innerHTML = `<div class="np-text">That was the last block for this day. Nice work.</div>`;
    return;
  }
  el.style.display = 'block';
  el.innerHTML = `<div class="np-text">Block ended. Start next: <b>${next.block.t}</b> (${next.block.dur}m)?</div><button id="startNextBtn">Start Next</button>`;
  document.getElementById('startNextBtn').onclick = ()=>{
    hideNextPrompt();
    selectBlock(next.idx);
    startTimer(false);
  };
}
function hideNextPrompt(){ document.getElementById('nextPrompt').style.display = 'none'; }

function renderClock(){
  const now = new Date();
  const h24 = now.getHours();
  const ampm = h24 >= 12 ? 'PM' : 'AM';
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  const hh = String(h12).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockDisplay').innerHTML = `${hh}:${mm}:${ss} <span class="clock-ampm">${ampm}</span>`;
  document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

function renderWeekNav(){
  const monday = getWeekMonday(weekOffset);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  document.getElementById('weekRange').textContent = `${fmtDate(monday)} \u2013 ${fmtDate(sunday)}` + (weekOffset===0 ? ' (this week)' : '');
}

function renderTabs(){
  const tabsEl = document.getElementById('dayTabs');
  tabsEl.innerHTML = '';
  DAY_CONFIG.forEach((day,i)=>{
    const date = getDateForDay(weekOffset, i);
    const el = document.createElement('div');
    el.className = 'tab' + (i===currentDayIdx ? ' active' : '');
    el.innerHTML = `${day.label}<span class="tab-date">${fmtDate(date)}</span>`;
    el.onclick = ()=>{ autoStartEnabled = false; currentDayIdx = i; selectedIdx = null; resetTimerState(); renderAll(); };
    tabsEl.appendChild(el);
  });
}

function renderDayNote(){
  const date = getDateForDay(weekOffset, currentDayIdx);
  const { note } = getBlocksAndNote(currentDayIdx, date);
  document.getElementById('dayNote').textContent = note ? `${date.toLocaleDateString(undefined,{weekday:'long'})}, ${fmtDate(date)} \u2014 ${note}` : `${date.toLocaleDateString(undefined,{weekday:'long'})}, ${fmtDate(date)}`;
}

function isBlockPastForToday(b){
  const viewedDate = getDateForDay(weekOffset, currentDayIdx);
  const now = new Date();
  if(dateKey(viewedDate) !== dateKey(now)) return false;
  const endSec = blockStartSeconds(b) + b.dur*60;
  return toSecondsOfDay(now) >= endSec;
}

function selectBlock(i, keepState){
  const blocksForSig = getCurrentBlocks();
  const newSig = blockSignature(blocksForSig[i]);
  const prevSig = selectedIdx !== null ? blockSignature(blocksForSig[selectedIdx]) : null;
  if(!keepState && prevSig && prevSig !== newSig){
    markCompleted(prevSig);
  }
  quickTimerMinutes = null;
  resetQuickTimerFills();
  selectedIdx = i;
  const blocks = getCurrentBlocks();
  const b = blocks[i];
  if(!keepState){
    totalSec = b.dur*60;
    remainingSec = totalSec;
    blockEndEpoch = null;
    warned5 = totalSec <= 300;
    warned150 = totalSec <= 150;
    warned15 = totalSec <= 900;
  }
  endPrompted = false;
  hideNextPrompt();
  running = false;
  clearInterval(timerInterval);
  document.getElementById('timerLabel').textContent = b.t;
  updateDisplay();
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnReset').disabled = false;
  document.getElementById('timerPanel').className = 'timer-panel';
  document.getElementById('timerDisplay').className = 'timer-display';
  renderBlockList();
  updateFillBar();
  updateNextUp();
  saveState();
}

function resetTimerState(){
  selectedIdx = null;
  quickTimerMinutes = null;
  running = false;
  blockEndEpoch = null;
  endPrompted = false;
  clearInterval(timerInterval);
  document.getElementById('timerLabel').textContent = 'Select a block above';
  document.getElementById('timerDisplay').textContent = '--:--';
  document.getElementById('timerDisplay').className = 'timer-display';
  document.getElementById('timerSub').textContent = '';
  document.getElementById('upNext').textContent = '';
  hideNextPrompt();
  document.getElementById('timerPanel').className = 'timer-panel';
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnReset').disabled = true;
  clearState();
}

function formatTime(sec){
  const neg = sec < 0;
  const abs = Math.abs(sec);
  const m = Math.floor(abs/60);
  const s = abs%60;
  return (neg?'+':'') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateDisplay(){
  const disp = document.getElementById('timerDisplay');
  const panel = document.getElementById('timerPanel');
  const sub = document.getElementById('timerSub');
  disp.textContent = formatTime(remainingSec);
  if(remainingSec <= 0){
    disp.className = 'timer-display overtime';
    panel.className = 'timer-panel overtime';
    sub.textContent = 'Time\'s up \u2014 running over';
  } else if(remainingSec <= 60){
    disp.className = 'timer-display critical';
    panel.className = 'timer-panel critical';
    sub.textContent = '1 minute or less remaining';
  } else if(remainingSec <= 150){
    disp.className = 'timer-display orange';
    panel.className = 'timer-panel orange';
    sub.textContent = '2:30 or less remaining';
  } else if(remainingSec <= 300){
    disp.className = 'timer-display warning';
    panel.className = 'timer-panel warning';
    sub.textContent = '5 minutes or less remaining';
  } else {
    disp.className = 'timer-display';
    panel.className = 'timer-panel';
    sub.textContent = '';
  }
}

function currentTier(){
  if(remainingSec <= 0) return 'overtime';
  if(remainingSec <= 60) return 'critical';
  if(remainingSec <= 150) return 'orange';
  if(remainingSec <= 300) return 'warning';
  return '';
}

function updateFillBar(){
  const elapsed = totalSec - remainingSec;
  const pct = Math.min(100, Math.max(0, (elapsed/totalSec)*100));
  const tier = currentTier();
  if(selectedIdx !== null){
    const fillEl = document.getElementById('fill-' + selectedIdx);
    if(fillEl){
      fillEl.style.width = pct + '%';
      fillEl.classList.toggle('done', remainingSec <= 0);
    }
  } else if(quickTimerMinutes !== null){
    const qtFill = document.getElementById('qt-fill-' + quickTimerMinutes);
    if(qtFill){
      qtFill.style.width = pct + '%';
      qtFill.className = 'qt-fill' + (tier ? ' ' + tier : '');
    }
  }
}

function resetQuickTimerFills(){
  document.querySelectorAll('.qt-fill').forEach(el=>{
    el.style.width = '0%';
    el.className = 'qt-fill';
  });
}

function tick(){
  if(running && blockEndEpoch !== null){
    remainingSec = Math.round((blockEndEpoch - Date.now()) / 1000);
  } else {
    remainingSec -= 1;
  }
  if(remainingSec <= 900 && remainingSec > 300 && !warned15){
    warned15 = true;
    beep(700,180,0.28);
    vibrate([150]);
  }
  if(remainingSec <= 300 && remainingSec > 150 && !warned5){
    warned5 = true;
    tripleBeep();
    vibrate([200,100,200,100,200]);
  }
  if(remainingSec <= 150 && remainingSec > 60 && !warned150){
    warned150 = true;
    quadBeep();
    vibrate([150,90,150,90,150,90,150]);
  }
  if(remainingSec > 0 && remainingSec <= 60 && remainingSec % 10 === 0){
    beep(1046,140,0.32);
    vibrate([120]);
  }
  if(remainingSec === 0 && !endPrompted){
    endPrompted = true;
    overtimeBeep();
    vibrate([300,100,300,100,300,100,300]);
    showNextPrompt();
  } else if(remainingSec < 0 && remainingSec % 60 === 0){
    overtimeBeep();
    vibrate([300]);
  }
  updateDisplay();
  updateFillBar();
  saveState();
}

function startTimer(silent){
  if(selectedIdx===null && quickTimerMinutes===null) return;
  running = true;
  blockEndEpoch = Date.now() + remainingSec*1000;
  if(!silent){
    startChime();
    vibrate([100,80,100,80,120]);
  }
  requestWakeLock();
  clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
  saveState();
}

// Resumes with an EXACT pre-existing end time (used only when restoring an
// already-running session after reload), rather than recomputing one from
// remainingSec -- guarantees zero added drift across a refresh.
function resumeAtExactEpoch(epoch, silent){
  if(selectedIdx===null && quickTimerMinutes===null) return;
  running = true;
  blockEndEpoch = epoch;
  remainingSec = Math.round((blockEndEpoch - Date.now())/1000);
  updateDisplay();
  updateFillBar();
  if(!silent){
    startChime();
    vibrate([100,80,100,80,120]);
  }
  requestWakeLock();
  clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
  saveState();
}

document.getElementById('btnStart').onclick = ()=> startTimer(false);
document.getElementById('btnPause').onclick = ()=>{
  if(running && blockEndEpoch !== null){
    remainingSec = Math.max(0, Math.round((blockEndEpoch - Date.now())/1000));
  }
  running = false;
  blockEndEpoch = null;
  clearInterval(timerInterval);
  updateDisplay();
  updateFillBar();
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  saveState();
};
document.getElementById('btnReset').onclick = ()=>{
  if(quickTimerMinutes !== null){ startQuickTimer(quickTimerMinutes); return; }
  if(selectedIdx===null) return;
  selectBlock(selectedIdx);
};

function checkForUpdate(){
  const cooldownUntil = Number(sessionStorage.getItem('updateCooldownUntil') || 0);
  if(Date.now() < cooldownUntil) return;

  const url = 'https://raw.githubusercontent.com/boonewheeler93-collab/block-timer/main/version.txt?t=' + Date.now();
  fetch(url, {cache:'no-store'})
    .then(r => r.ok ? r.text() : null)
    .then(text => {
      if(!text) return;
      const remoteVersion = text.trim();
      if(remoteVersion && remoteVersion !== APP_VERSION){
        // Set a cooldown BEFORE navigating, so even if the next load somehow
        // still mismatches, it cannot immediately reload again.
        sessionStorage.setItem('updateCooldownUntil', String(Date.now() + 20000));
        const syncBtnEl = document.getElementById('syncBtn');
        if(syncBtnEl) syncBtnEl.classList.add('spinning');
        location.href = 'https://boonewheeler93-collab.github.io/block-timer/?_r=' + Date.now();
      }
    })
    .catch(()=>{});
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){ checkForUpdate(); autoWatchTick(); }
});
window.addEventListener('focus', ()=>{ checkForUpdate(); autoWatchTick(); });
window.addEventListener('pageshow', ()=>{ checkForUpdate(); autoWatchTick(); });
setInterval(checkForUpdate, 60000);

document.getElementById('syncBtn').onclick = ()=>{
  document.getElementById('syncBtn').classList.add('spinning');
  location.reload();
};

document.getElementById('prevWeek').onclick = ()=>{
  autoStartEnabled = false;
  weekOffset -= 1;
  currentDayIdx = 0;
  selectedIdx = null;
  resetTimerState();
  renderAll();
};
document.getElementById('nextWeek').onclick = ()=>{
  autoStartEnabled = false;
  weekOffset += 1;
  currentDayIdx = 0;
  selectedIdx = null;
  resetTimerState();
  renderAll();
};

function syncAutoToggleUI(){
  document.getElementById('autoToggle').checked = autoStartEnabled;
  const status = document.getElementById('autoStatus');
  if(!autoStartEnabled){ status.textContent = ''; return; }
  const today = dayNameFromDate(new Date());
  if(!today){ status.textContent = 'No blocks scheduled today \u2014 nothing to auto-start.'; return; }
  status.textContent = `Watching ${today} \u2014 auto-starts on time, or catches up if already underway.`;
}

function jumpToToday(){
  const today = dayNameFromDate(new Date());
  if(!today) return;
  const targetIdx = DAY_LABELS.indexOf(today);
  const changed = (weekOffset !== 0 || currentDayIdx !== targetIdx);
  weekOffset = 0;
  currentDayIdx = targetIdx;
  if(changed){
    // The view was on a different day/week -- any selected block belonged to
    // that context and is no longer valid. Clear it so today's real schedule
    // gets evaluated fresh instead of silently pointing at the wrong block.
    resetTimerState();
  }
  renderTabs();
  renderWeekNav();
  renderDayNote();
  renderBlockList();
}

function toSecondsOfDay(date){
  return date.getHours()*3600 + date.getMinutes()*60 + date.getSeconds();
}
function blockStartSeconds(b){
  const [h,m] = b.s.split(':').map(Number);
  return h*3600 + m*60;
}
function findOngoingBlockIndex(blocks, nowDate){
  const nowSec = toSecondsOfDay(nowDate);
  for(let i=0;i<blocks.length;i++){
    const startSec = blockStartSeconds(blocks[i]);
    const endSec = startSec + blocks[i].dur*60;
    if(nowSec >= startSec && nowSec < endSec) return i;
  }
  return -1;
}

function autoWatchTick(){
  if(!autoStartEnabled) return;
  const now = new Date();
  const today = dayNameFromDate(now);
  if(!today) return;
  const expectedIdx = DAY_LABELS.indexOf(today);
  if(weekOffset !== 0 || currentDayIdx !== expectedIdx){
    jumpToToday();
  }
  const hhmm = nowHHMM(now);
  const blocks = getCurrentBlocks();

  const exactIdx = blocks.findIndex(b => b.s === hhmm);
  if(exactIdx !== -1){
    const key = hhmm + '-' + exactIdx;
    if(key !== lastAutoKey){
      lastAutoKey = key;
      selectBlock(exactIdx);
      startTimer(false);
    }
    return;
  }

  // Catch up if: nothing's selected yet, OR the current block is sitting in
  // overtime and a genuinely different block has since started (e.g. the
  // phone was locked/backgrounded through the exact start-minute transition).
  if(quickTimerMinutes === null && (selectedIdx === null || remainingSec < 0)){
    const ongoingIdx = findOngoingBlockIndex(blocks, now);
    if(ongoingIdx !== -1){
      const currentSig = selectedIdx !== null ? blockSignature(blocks[selectedIdx]) : null;
      const ongoingSig = blockSignature(blocks[ongoingIdx]);
      if(ongoingSig !== currentSig){
        const catchUpKey = 'ongoing-' + dateKey(now) + '-' + ongoingIdx;
        if(catchUpKey !== lastAutoKey){
          lastAutoKey = catchUpKey;
          const b = blocks[ongoingIdx];
          const elapsedSec = toSecondsOfDay(now) - blockStartSeconds(b);
          selectBlock(ongoingIdx);
          remainingSec = Math.max(0, totalSec - elapsedSec);
          warned15 = remainingSec <= 900;
          warned5 = remainingSec <= 300;
          warned150 = remainingSec <= 150;
          updateDisplay();
          updateFillBar();
          startTimer(false);
        }
      }
    } else if(selectedIdx !== null && remainingSec < -1200){
      // Nothing's currently underway, and this selection is way past just
      // "running long" (20+ min overtime) -- it's stale from an earlier
      // session with nothing to hand off to. Clear it rather than leaving
      // an ever-climbing overtime number hanging around for hours.
      resetTimerState();
    }
  }
}

document.getElementById('autoToggle').onchange = (e)=>{
  autoStartEnabled = e.target.checked;
  if(autoStartEnabled){ jumpToToday(); }
  syncAutoToggleUI();
  saveState();
};

function startQuickTimer(minutes){
  autoStartEnabled = false;
  syncAutoToggleUI();
  selectedIdx = null;
  quickTimerMinutes = minutes;
  resetQuickTimerFills();
  totalSec = minutes*60;
  remainingSec = totalSec;
  blockEndEpoch = null;
  warned5 = totalSec <= 300;
  warned150 = totalSec <= 150;
  warned15 = totalSec <= 900;
  endPrompted = false;
  hideNextPrompt();
  running = false;
  clearInterval(timerInterval);
  const label = minutes >= 60 ? `Quick Timer \u2014 ${minutes/60}hr` : `Quick Timer \u2014 ${minutes} min`;
  document.getElementById('timerLabel').textContent = label;
  updateDisplay();
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnReset').disabled = false;
  document.getElementById('timerPanel').className = 'timer-panel';
  document.getElementById('timerDisplay').className = 'timer-display';
  document.getElementById('upNext').textContent = '';
  renderBlockList();
  saveState();
}

function renderQuickTimerButtons(){
  const grid = document.getElementById('quickTimerGrid');
  const options = [
    {label:'1 hr', minutes:60},
    {label:'45 min', minutes:45},
    {label:'30 min', minutes:30},
    {label:'15 min', minutes:15},
    {label:'5 min', minutes:5},
    {label:'1 min', minutes:1},
  ];
  grid.innerHTML = '';
  options.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'qt-btn';
    btn.setAttribute('data-minutes', opt.minutes);
    btn.innerHTML = `<div class="qt-fill" id="qt-fill-${opt.minutes}"></div><div class="qt-btn-label">${opt.label}</div>`;
    btn.onclick = ()=> startQuickTimer(opt.minutes);
    grid.appendChild(btn);
  });
}

function renderAll(){
  renderWeekNav();
  renderTabs();
  renderDayNote();
  renderBlockList();
  resetTimerState();
  syncAutoToggleUI();
}

function restoreState(saved){
  if(!saved) return;
  const hasRealBlock = saved.selectedIdx !== null && saved.selectedIdx !== undefined;
  const hasQuickTimer = saved.quickTimerMinutes !== null && saved.quickTimerMinutes !== undefined;
  if(!hasRealBlock && !hasQuickTimer) return;

  weekOffset = saved.weekOffset;
  currentDayIdx = saved.currentDayIdx;
  autoStartEnabled = !!saved.autoStartEnabled;
  renderWeekNav();
  renderTabs();
  renderDayNote();
  renderBlockList();

  let resolvedIdx = saved.selectedIdx;
  if(hasRealBlock){
    const blocks = getCurrentBlocks();
    // Don't trust the stored position blindly -- the schedule data may have
    // shifted (edits, test blocks added/removed, etc). Re-find the exact same
    // block by its signature; if it's genuinely gone, abandon the restore
    // rather than showing a countdown for the wrong thing.
    const freshIdx = blocks.findIndex(b => blockSignature(b) === saved.blockSig);
    if(freshIdx === -1){
      resetTimerState();
      return;
    }
    resolvedIdx = freshIdx;
  }

  totalSec = saved.totalSec;
  remainingSec = saved.remainingSec;
  warned5 = !!saved.warned5;
  warned150 = !!saved.warned150;
  warned15 = !!saved.warned15;
  endPrompted = !!saved.endPrompted;

  if(saved.running && saved.blockEndEpoch){
    remainingSec = Math.max(0, Math.round((saved.blockEndEpoch - Date.now()) / 1000));
  }

  if(hasQuickTimer){
    quickTimerMinutes = saved.quickTimerMinutes;
    selectedIdx = null;
    const label = quickTimerMinutes >= 60 ? `Quick Timer \u2014 ${quickTimerMinutes/60}hr` : `Quick Timer \u2014 ${quickTimerMinutes} min`;
    document.getElementById('timerLabel').textContent = label;
    updateDisplay();
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnPause').disabled = true;
    document.getElementById('btnReset').disabled = false;
  } else {
    selectBlock(resolvedIdx, true);
  }

  if(saved.running && saved.blockEndEpoch){
    resumeAtExactEpoch(saved.blockEndEpoch, true);
  }
  syncAutoToggleUI();
}

const savedOnLoad = loadState();
if(savedOnLoad && savedOnLoad.lastAutoKey){ lastAutoKey = savedOnLoad.lastAutoKey; }
renderAll();
renderQuickTimerButtons();
restoreState(savedOnLoad);
autoStartEnabled = true;
syncAutoToggleUI();
renderClock();
setInterval(renderClock, 1000);
autoWatchTick();
autoWatchInterval = setInterval(autoWatchTick, 1000);
</script>
</body>
</html>
